# Render Blueprint for the SubCycle public DEMO (mock billing only). See docs/DEPLOYMENT.md before using it.
# Free-tier resources: the API sleeps after inactivity and the free database expires, so this is a demo, not production.
# No secrets live in this file: JWT_SECRET is generated by Render, DATABASE_URL is referenced from the database, and the two
# URLs marked `sync: false` are entered by you when the Blueprint is first created.
databases:
  - name: subcycle-db
    plan: free
    region: oregon
    databaseName: subcycle
    user: subcycle
    postgresMajorVersion: "16"

services:
  # --- API (Express) ---
  - type: web
    name: subcycle-api
    runtime: node
    region: oregon
    plan: free
    autoDeployTrigger: "off"
    # Dev dependencies are required to build (tsc) and to run migrations (tsx).
    buildCommand: npm ci --include=dev && npm run build -w server
    # Free instances have no pre-deploy command, so migrations and plan seeding run before the server starts.
    # Both are idempotent: migrations are forward-only with checksums and an advisory lock; seeding upserts the plans by code.
    startCommand: npm run db:migrate -w server && npm run db:seed -w server && npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: subcycle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The exact origin of the static site below (https://<site>.onrender.com, no trailing slash). Entered at first sync.
      - key: CORS_ORIGINS
        sync: false
      # Render's load balancer is one reverse-proxy hop in front of the API (see docs/DEPLOYMENT.md before changing).
      - key: TRUST_PROXY
        value: "1"
      - key: ENABLE_DEV_ENDPOINTS
        value: "false"
      - key: MOCK_BILLING_FAIL
        value: never
      # In-process scheduler: it only runs while the free instance is awake.
      - key: RUN_JOBS
        value: "true"
      - key: JOBS_CRON
        value: "* * * * *"

  # --- Web app (Vite static build) ---
  - type: web
    name: subcycle-web
    runtime: static
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Public URL of the API (https://<api>.onrender.com, no trailing slash); baked into the bundle at build time. Not a secret.
      - key: VITE_API_URL
        sync: false
    routes:
      # Client-side routing: deep links such as /billing must serve the app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
