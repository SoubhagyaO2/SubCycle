name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, build, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subcycle
          POSTGRES_PASSWORD: subcycle_ci_password
          POSTGRES_DB: subcycle_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subcycle -d subcycle_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://subcycle:subcycle_ci_password@localhost:5432/subcycle_dev
      # The server suite and the client's real-backend suite BOTH reset and use this database.
      TEST_DATABASE_URL: postgres://subcycle:subcycle_ci_password@localhost:5432/subcycle_test
      PGPASSWORD: subcycle_ci_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Create the test database
        run: psql -h localhost -U subcycle -d postgres -c "CREATE DATABASE subcycle_test"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production builds (server and client)
        run: npm run build

      - name: Fresh PostgreSQL migration and seed check
        # Creates an empty temporary database, applies every migration, re-runs (must be a no-op),
        # seeds three times (must stay at four plans), checks the schema, and drops the database.
        run: npm run db:check-fresh

      - name: Migrate and seed the dev database (what a developer does after `npm run db:up`)
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed

      # ORDER MATTERS: both suites reset and use the same TEST_DATABASE_URL, so they must never run at the same time.
      # They are separate steps of ONE job, which GitHub runs strictly in sequence. Do not split them into parallel
      # jobs or a matrix without giving each its own database.
      - name: Server tests (resets the test database first)
        run: npm run test:server

      - name: Client tests (unit/component, then the real-backend suite; resets the test database first)
        run: npm run test:client

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
